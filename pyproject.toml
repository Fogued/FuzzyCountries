[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fuzzy-countries"
version = "0.2.0"
description = "Fuzzy-logic socioeconomic model for 49 countries, with reproducibility tooling and a Power BI export."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Diego Fogued" },
]
keywords = ["fuzzy-logic", "socioeconomic", "power-bi", "data-analysis", "rfuzzy"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.5",
]

[project.scripts]
fuzzy-countries = "fuzzy_countries.cli:main"

[project.urls]
Homepage = "https://github.com/Fogued/FuzzyCountries"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "cred"]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
  "error::DeprecationWarning:fuzzy_countries.*",
]

[tool.coverage.run]
source = ["fuzzy_countries", "cred"]
branch = true

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [
  "Data",
  "Memoria",
  "Presentation",
  ".venv",
  "build",
  "dist",
  "floatToInt.py",  # legacy one-off script kept for provenance
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
  "E501",  # line length is handled by the formatter
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
